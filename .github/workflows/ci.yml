name: CI

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:

env:
  TEXLIVE_VERSION: 2026
  TERM: xterm
  # silences warnings from jupyter about not being able to debug the stdlib
  PYDEVD_DISABLE_FILE_VALIDATION: 1

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        # We need login shells (-l) for micromamba to work.
        shell: bash -leo pipefail {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Mamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment.yml
          post-cleanup: 'all'

      - name: Apt installs
        run: |
          sudo apt update
          sudo apt install --yes poppler-utils imagemagick

      - name: Install Comic Sans
        env:
          COMIC_SHARE_TOKEN: ${{ secrets.COMIC_SHARE_TOKEN }}
          COMIC_SHARE_PASSWORD: ${{ secrets.COMIC_SHARE_PASSWORD }}
        run: |
          mkdir -p $HOME/.local/share/fonts

          # COMIC_SHARE_TOKEN is the hash in the share link
          curl -fsSL -OJ -u "anonymous:${COMIC_SHARE_PASSWORD}"  "https://nextcloud.pep-dortmund.org/public.php/dav/files/${COMIC_SHARE_TOKEN}/"
          unzip comic-sans-ms.zip -d $HOME/.local/share/fonts
          rm comic-sans-ms.zip
          fc-cache
          fc-list 'Comic Sans MS' | grep Comic

      - name: Pip install^2-texlive
        run: pip install install-texlive

      - name: Install TeXlive
        run: python -m install_texlive -p $HOME/texlive -t $TEXLIVE_VERSION --collections='-a' --package-file tex-packages.txt --update -v

      - name: Setup TeXLive
        run: |
          # add to path for following steps
          echo "$HOME/texlive/$TEXLIVE_VERSION/bin/x86_64-linux" >> $GITHUB_PATH
          export PATH="$HOME/texlive/$TEXLIVE_VERSION/bin/x86_64-linux:$PATH"
          tlmgr install --with-doc tex-overview
          # generate the lualatex font cache, otherwise it is done in parallel when calling make
          luaotfload-tool --update --force

      - name: latexmkrc
        run: |
          # copy latexmkrc to make sure its used also for vXXX
          mkdir -p ~/.config/latexmk
          cp common/latexmkrc ~/.config/latexmk/

      - name: pre-commit
        run: |
          pre-commit install
          pre-commit

      - name: Check Setup
        run: |
          echo "which python"
          which python
          echo "python --version"
          python --version
          echo "conda list"
          conda list

      - name: Cache external images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            intro/build/figures/*.png
            intro/build/figures/*.jpg
            git/build/figures/*.png
          # Invalidate when download URLs or image recipes change.
          key: external-images-v1-${{ runner.os }}-${{ hashFiles('intro/Makefile', 'git/Makefile') }}

      - name: Build
        run: |
          make -j 4

      - name: check for errors
        if: always()
        run: "! grep -R --include='*.log' '^!' -A 5 -B 5"

      - name: Prepare Upload
        run: |
          mkdir toolbox-material
          cp **/build/*.pdf toolbox-material
          cp **/build/*.zip toolbox-material
          cp python/build/*.html toolbox-material
          ls -lh toolbox-material

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload Material
        with:
          name: Toolbox_Material
          path: toolbox-material/*
